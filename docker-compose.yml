services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      FTF_DATA_DIR: /data
      FTF_COMPREFACE_URL: http://compreface
    volumes:
      - ./data:/data
      # Material to ingest, read-only. Point FTF_SAMPLE_DIR at your copy of the sample.
      # If the folder is missing, Docker mounts an empty one and `ftf ingest` reports no views.
      - ${FTF_SAMPLE_DIR:-./testing_sample}:/sample:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  # Private face service: no published port, so only the containers here can reach it.
  compreface:
    image: exadel/compreface:1.2.0-facenet@sha256:c575ebd73b471c54695aea9c4a974a3cbc618e0091bf0e98a3347e455d29b68e
    restart: unless-stopped
    mem_limit: 5g
    environment:
      SAVE_IMAGES_TO_DB: "false"  # keep face templates only, not the photos
      ENABLE_EMAIL_SERVER: "false"
      API_JAVA_OPTS: "-Xmx1g"
      ADMIN_JAVA_OPTS: "-Xmx512m"
    volumes:
      - compreface-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 8

  # Loads the closed reference list once the service is up. Safe to run again.
  faces-setup:
    build: .
    command: ["ftf", "faces", "setup"]
    restart: on-failure:5
    env_file:
      - path: .env
        required: false
    environment:
      FTF_DATA_DIR: /data
      FTF_COMPREFACE_URL: http://compreface
    volumes:
      - ./data:/data
    depends_on:
      compreface:
        condition: service_healthy
        required: false  # the app must start even when the face service cannot

volumes:
  compreface-db:
