[project]
name = "ftf"
version = "0.1.0"
description = "Follow the Fake: links suspicious ads and landing pages into campaigns"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "tldextract>=5.1",
    "streamlit>=1.38",
    "google-genai>=3.6.1",
    "openai>=3.57.0",
    "pillow>=10",
    "imagehash>=4.3.2",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "dnspython>=2.9.2",
    "playwright==1.65.2",  # must match the Dockerfile base image tag
]

[project.scripts]
ftf = "ftf.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ftf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]
